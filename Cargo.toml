[workspace]
members = ["lexinode-backend", "lexinode-cli", "lexinode-core"]
resolver = "2"

[workspace.package]
license = "AGPL-3.0"
repository = "https://github.com/Iota-Wu/lexinode"
authors = ["Iota Wu <wordless0401@icloud.com>"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }

clone_on_ref_ptr = "deny"
inefficient_to_string = "deny"
no_effect_replace = "deny"
redundant_clone = "deny"
unnecessary_join = "deny"
box_collection = "deny"
slow_vector_initialization = "deny"
vec_box = "deny"
filter_next = "deny"
flat_map_identity = "deny"
manual_flatten = "deny"

missing_errors_doc = "allow"
unwrap_used = "warn"
cognitive_complexity = "deny"

[workspace.dependencies]
serde = "1.0.229"
sqlx = { version = "0.9.0", features = [
    "postgres",
    "runtime-tokio",
    "tls-native-tls",
    "uuid",
    "chrono",
    "migrate"
] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }
pgvector = { version = "0.4.2", features = ["sqlx", "serde"] }
