[workspace]
members = ["lexinode-backend", "lexinode-cli", "lexinode-core"]
resolver = "2"

[workspace.package]
license = "AGPL-3.0"
repository = "https://github.com/Iota-Wu/lexinode"
authors = ["Iota Wu <wordless0401@icloud.com>"]

[workspace.dependencies]
serde = "1.0.229"
sqlx = { version = "0.9.0", features = [
    "postgres",
    "runtime-tokio",
    "tls-native-tls",
    "uuid",
    "chrono",
    "migrate"
] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }
pgvector = { version = "0.4.2", features = ["sqlx", "serde"] }
