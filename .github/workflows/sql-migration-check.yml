name: SQL Migration Check

on:
  push:
    paths:
      - '**/migrations/*.sql'
      - '.github/workflows/sql-migration-check.yml'

  pull_request: 
    paths:
      - '**/migrations/*.sql'
      - '.github/workflows/sql-migration-check.yml'

jobs:
  test-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: lexinode_test
          POSTGRES_HOST_AUTH_METHOD: trust

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run SQLx Migrations
        env:
          DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/lexinode_test
        run: |
          if [ -d "./lexinode-core/migrations" ]; then
            sqlx migrate run --source ./lexinode-core/migrations
          else
            echo "Migrations directory not found. Skipping migration check."
          fi